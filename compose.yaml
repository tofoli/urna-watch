services:
  urna-watch:
    build:
      context: .
    image: urna-watch:local
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - path: .env
        required: false
    environment:
      URNA_TUI: "false"
      URNA_STATE_PATH: /app/data/state.json
      URNA_STATUS_ADDR: 0.0.0.0:8080
      URNA_LOG_FORMAT: json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - urna-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  urna-data:
